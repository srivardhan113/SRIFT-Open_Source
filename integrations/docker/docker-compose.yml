version: "3.9"

services:
  srift:
    build:
      context: ../..
      dockerfile: integrations/docker/Dockerfile
    container_name: srift-daemon
    ports:
      - "127.0.0.1:3822:3822"
    environment:
      SRIFT_DAEMON_PORT: 3822
      SRIFT_PUBLIC_BASE: https://srift.app
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3822/status', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - srift-net

networks:
  srift-net:
    driver: bridge
