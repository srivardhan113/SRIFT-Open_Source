# Kubernetes Deployment + Service for the SRIFT daemon as a cluster-internal sidecar.
# Any pod in the namespace can hit http://srift:3822/.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: srift
  labels: { app: srift }
spec:
  replicas: 1
  selector: { matchLabels: { app: srift } }
  template:
    metadata:
      labels: { app: srift }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: srift
          image: ghcr.io/sripto/srift-daemon:2.2.5    # build from integrations/docker/Dockerfile
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports: [ { containerPort: 3822, name: http } ]
          env:
            - { name: SRIFT_DAEMON_PORT, value: "3822" }
            - { name: SRIFT_PUBLIC_BASE, value: "https://srift.app" }
            - { name: NODE_ENV, value: "production" }
          readinessProbe:
            httpGet: { path: /status, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: srift }
spec:
  type: ClusterIP
  selector: { app: srift }
  ports: [ { name: http, port: 3822, targetPort: http } ]
