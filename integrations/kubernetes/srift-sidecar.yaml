# SRIFT daemon as a sidecar in the SAME pod as your agent.
#
# The daemon listens on 127.0.0.1:3822 only (no auth, so it must never be
# exposed) and rejects non-loopback Host headers. Containers in one pod share
# localhost, so the agent calls http://127.0.0.1:3822. Do not put a Service in
# front of it: other pods cannot and should not reach it.
#
# Image: docker build -t srift-daemon:4.1.0 integrations/docker

apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-agent
  labels: { app: my-agent }
spec:
  replicas: 1
  selector: { matchLabels: { app: my-agent } }
  template:
    metadata:
      labels: { app: my-agent }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      volumes:
        - name: shared
          emptyDir: {}
      containers:
        - name: agent
          image: your-agent-image:latest
          env:
            - { name: SRIFT_BASE_URL, value: "http://127.0.0.1:3822" }
          volumeMounts:
            - { name: shared, mountPath: /work }   # files to share live here

        - name: srift
          image: srift-daemon:4.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: shared, mountPath: /work }   # same paths as the agent
          # httpGet probes go to the pod IP, which the loopback-only daemon does not
          # listen on; probe from inside the container instead.
          readinessProbe:
            exec:
              command: ["node", "-e", "require('http').get('http://127.0.0.1:3822/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["node", "-e", "require('http').get('http://127.0.0.1:3822/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
