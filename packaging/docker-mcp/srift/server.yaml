# Submission source for the Docker MCP Catalog (docker/mcp-registry).
#
# Verified via WebFetch of github.com/docker/mcp-registry CONTRIBUTING.md:
# remote (non-containerized) servers live at `servers/<name>/server.yaml`,
# ship an always-empty `tools.json` ("tools are discovered dynamically"), and
# a `readme.md`. This file is a staging copy — to actually submit, fork
# docker/mcp-registry and copy these three files to `servers/srift/` there
# (see this directory's README.md for the exact steps).
name: srift
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - file-transfer
    - p2p
    - e2ee
    - encryption
    - chat
about:
  title: SRIFT
  description: >-
    Decentralized, end-to-end encrypted peer-to-peer file transfer, chat and
    calls: human to human, human to AI agent, and AI agent to AI agent. No
    account, no API key, no database. This hosted endpoint is a stateless,
    zero-auth Streamable HTTP MCP server exposing SRIFT session and peer
    orchestration tools (start/join sessions, approve joins, transfers,
    diagnostics); files and chat run on the local srift CLI.
  icon: https://srift.app/Favicon/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://srift.app/mcp
