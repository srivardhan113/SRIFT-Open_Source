# Submission source for the Docker MCP Catalog (docker/mcp-registry).
#
# Verified via WebFetch of github.com/docker/mcp-registry CONTRIBUTING.md:
# remote (non-containerized) servers live at `servers/<name>/server.yaml`,
# ship an always-empty `tools.json` ("tools are discovered dynamically"), and
# a `readme.md`. This file is a staging copy — to actually submit, fork
# docker/mcp-registry and copy these three files to `servers/srift/` there
# (see this directory's README.md for the exact steps).
name: srift
type: remote
meta:
  category: productivity
  tags:
    - file-transfer
    - p2p
    - e2ee
    - encryption
    - chat
about:
  title: SRIFT
  description: >-
    Zero-config, zero-token peer-to-peer secure file transfer, encrypted chat,
    and session orchestration for AI agents. No account, no API key: the
    hosted endpoint below is a stateless, zero-auth JSON-RPC 2.0 / MCP
    2025-06-18 server exposing SRIFT's session/peer orchestration tools.
  icon: https://srift.app/Favicon/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://srift.app/mcp
