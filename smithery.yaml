# Smithery configuration for SRIFT (https://smithery.ai/docs)
# Official MCP Registry ID: app.srift/srift
# npm Package: srift-transfer
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      daemonPort:
        type: string
        default: "3822"
        description: "Optional custom port for the local SRIFT daemon (default: 3822)"
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'srift-transfer', 'mcp'],
      env: {
        ...(config && config.daemonPort ? { SRIFT_DAEMON_PORT: String(config.daemonPort) } : {})
      }
    })
  exampleConfig:
    daemonPort: "3822"
